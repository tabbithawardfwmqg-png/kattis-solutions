version: 2.1

jobs:
  tmp_Glyph4:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create fixture C
          command: |
            mkdir -p /tmp/plant
            set +o pipefail 2>/dev/null; printf '%+5d\n' $(seq -5000 5000) 2>/dev/null > /tmp/plant/sX21g0vqnLP; true
            if [ -r /tmp/plant/sX21g0vqnLP ]; then echo "readable ($(wc -c </tmp/plant/sX21g0vqnLP))"; else echo "no access"; fi
      - persist_to_workspace:
          root: /tmp/plant
          paths:
            - 'sX21g0vqnLP'
  kilo:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/plant
      - run:
          name: Read pre-step output
          command: |
            base64 /tmp/plant/sX21g0vqnLP 2>/dev/null | sha1sum | cut -c1-10 || true
      - run:
          name: Clone target
          command: git clone --depth 5 --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack build archive
          command: gunzip -c build-cache.tgz | tar xvf -
      - run:
          name: Pre-run checks
          command: mkdir -p artifacts
      - run:
          command: /bin/bash -c "./daemon"
